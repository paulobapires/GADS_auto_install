# =============================================================================
# Configuração de instalação do GADS PROVIDER
# Usado por: gads-provider-install.sh
#
# Formato: sintaxe de shell (KEY="valor"). Linhas iniciadas com # são comentários.
# Após a instalação, os valores efetivos ficam em /etc/sysconfig/gads e podem
# ser alterados lá (seguido de `systemctl restart gads-provider`) ou reexecutando
# o script com este arquivo alterado.
# =============================================================================

# -----------------------------------------------------------------------------
# Obrigatórios
# -----------------------------------------------------------------------------

# Nome (nickname) do provider. Identifica a configuração do provider no hub/MongoDB.
PROVIDER_NICKNAME="provider-01"

# Endereço do hub ao qual o provider se conecta, ex.: "http://192.168.1.10:10000".
PROVIDER_HUB="http://192.168.1.10:10000"

# Endereço do MongoDB (o mesmo usado pelo hub) no formato host:porta.
PROVIDER_MONGO_DB="192.168.1.10:27017"

# -----------------------------------------------------------------------------
# Registro do provider no hub
# -----------------------------------------------------------------------------
# O binário do provider só inicia se houver uma configuração com este nickname
# no hub (Admin > Providers). Com PROVIDER_REGISTER="true" o script cria ou
# atualiza essa configuração via API do hub.
PROVIDER_REGISTER="true"

# Credenciais de um usuário admin do hub (usadas só no registro).
HUB_ADMIN_USER="admin"
HUB_ADMIN_PASSWORD="password"

# IP deste provider, que o hub usa para acessá-lo ("auto" = IP principal).
PROVIDER_HOST_ADDRESS="auto"

# Porta HTTP do provider.
PROVIDER_PORT="10001"

# -----------------------------------------------------------------------------
# Plataformas atendidas (padrão: todas)
# -----------------------------------------------------------------------------
# Cada plataforma habilitada instala suas dependências no host E é habilitada
# na configuração do provider no hub.
PROVIDE_ANDROID="true"     # Android (adb / Android SDK / uiautomator2)
PROVIDE_ANDROID_TV="true"  # Android TV (mesmas ferramentas do Android; conexão via adb connect)
PROVIDE_IOS="true"         # iOS (usbmuxd + WebDriverAgent)
PROVIDE_TIZEN="true"       # Samsung Tizen TV (Tizen Studio CLI / sdb)
PROVIDE_WEBOS="true"       # LG webOS TV (webOS CLI / ares)

# iOS: o provider exige um WebDriverAgent .ipa assinado no hub (Admin > Files).
# Informe o caminho de um .ipa neste host para o script enviá-lo e selecioná-lo.
# Se não houver .ipa no hub nem aqui, o iOS fica DESABILITADO na configuração
# do provider (o host continua preparado) até o arquivo ser enviado.
WDA_IPA_PATH=""
WDA_BUNDLE_ID="com.shamanec.WebDriverAgentRunner"

# Selenium Grid 4 (opcional; só em releases que ainda suportam o recurso).
# Exige o selenium.jar enviado em Admin > Files.
USE_SELENIUM_GRID="false"
SELENIUM_GRID=""

# -----------------------------------------------------------------------------
# Opcionais (valores padrão adequados para a maioria dos casos)
# -----------------------------------------------------------------------------

# Nível de log do provider (info|debug).
PROVIDER_LOG_LEVEL="debug"

# Pasta de dados do provider (logs, apps, drivers). Vazio = ${GADS_DIR}/${PROVIDER_NICKNAME}
PROVIDER_FOLDER=""

# Release do GADS: latest (mais recente, inclui pre-releases) | stable | <tag>
# Recomendado: a MESMA release instalada no hub.
GADS_VERSION="latest"
GADS_REPO="gifflet/GADS"
GADS_DIR="/root/GADS"

# Diretório das ferramentas externas (Android SDK, Tizen Studio, webOS CLI, Node).
TOOLS_DIR="/root/.tools"

# Node.js (versão major; é instalada a última versão desta linha).
NODE_MAJOR="22"

# Appium e drivers. Os drivers de TV (Tizen/webOS) só suportam Appium 2.x,
# por isso o Appium fica em 2.x com as últimas versões de uiautomator2 e
# xcuitest compatíveis com ele. Formato: pacote-npm@versão.
APPIUM_VERSION="2.19.0"
APPIUM_DRIVER_UIAUTOMATOR2="appium-uiautomator2-driver@4.2.9"
APPIUM_DRIVER_XCUITEST="appium-xcuitest-driver@9.10.5"
APPIUM_DRIVER_TIZEN="appium-tizen-tv-driver@0.18.1"
APPIUM_DRIVER_WEBOS="appium-lg-webos-driver@0.5.0"
# Plugin do GADS para o Appium. Vazio (recomendado) = o próprio provider instala
# a versão que a release espera ao iniciar. Ex. para forçar: "appium-gads@0.0.11"
APPIUM_PLUGIN_GADS=""

# Java (necessário ao Android SDK e ao uiautomator2).
JAVA_PACKAGE="openjdk-17-jdk-headless"

# Android SDK: build-tools "latest" ou uma versão específica, ex.: "35.0.0".
ANDROID_BUILD_TOOLS="latest"
# Pacotes extras do sdkmanager, separados por espaço. O "emulator" não é usado
# com dispositivos reais, mas é exigido pelo `appium driver doctor uiautomator2`.
ANDROID_SDK_EXTRA_PACKAGES="emulator"
# bundletool (instalação de .aab): "latest" ou uma tag, ex.: "1.18.1".
BUNDLETOOL_VERSION="latest"

# Instalador do Tizen Studio CLI (Ubuntu 64 bits).
TIZEN_INSTALLER_URL="https://download.tizen.org/sdk/Installer/tizen-studio_6.1/web-cli_Tizen_Studio_6.1_ubuntu-64.bin"

# webOS TV CLI (pacote npm oficial da LG): "latest" ou uma versão, ex.: "3.2.6".
WEBOS_CLI_VERSION="latest"

# Flags adicionais repassadas ao `GADS provider` (dependem da release), ex.:
#   PROVIDER_EXTRA_ARGS="--use-ios-pair-cache"
# Consulte `./GADS provider --help` na release instalada.
PROVIDER_EXTRA_ARGS=""

# Libera a porta do provider no UFW, se o UFW estiver ativo.
OPEN_FIREWALL="true"

# Token opcional do GitHub para evitar limite de requisições anônimas da API.
GITHUB_TOKEN=""
