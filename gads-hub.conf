# =============================================================================
# Configuração de instalação do GADS HUB
# Usado por: gads-hub-install.sh
#
# Formato: sintaxe de shell (KEY="valor"). Linhas iniciadas com # são comentários.
# Após a instalação, os valores efetivos ficam em /etc/sysconfig/gads e podem
# ser alterados lá (seguido de `systemctl restart gads-hub`) ou reexecutando
# o script com este arquivo alterado.
# =============================================================================

# -----------------------------------------------------------------------------
# Obrigatórios / principais
# -----------------------------------------------------------------------------

# Endereço (IP ou hostname) em que o hub vai escutar e ser acessado,
# ex.: "192.168.1.10". Também aceita "http://192.168.1.10" (o esquema é removido).
#   auto     -> usa o IP principal da máquina (rota padrão)
#   0.0.0.0  -> escuta em todas as interfaces
HUB_HOST_ADDRESS="auto"

# Porta HTTP da UI + API do hub.
HUB_PORT="10000"

# Endereço do MongoDB no formato host:porta.
# Se apontar para esta própria máquina (localhost, 127.0.0.1 ou um IP local),
# o script instala o MongoDB via Docker automaticamente (ver MONGO_INSTALL).
HUB_MONGO_DB="localhost:27017"

# Autenticação na UI/API do hub (true|false). Padrão: true.
# Com false qualquer pessoa acessa tudo sem login (use só para desenvolvimento).
HUB_AUTH="true"

# -----------------------------------------------------------------------------
# Opcionais (valores padrão adequados para a maioria dos casos)
# -----------------------------------------------------------------------------

# Instalação do MongoDB local via Docker:
#   auto  -> instala somente se HUB_MONGO_DB apontar para esta máquina
#   true  -> sempre instala localmente (na porta definida em HUB_MONGO_DB)
#   false -> nunca instala (o MongoDB já existe em outro lugar)
MONGO_INSTALL="auto"

# Imagem Docker do MongoDB (v6.0 é a recomendada pelo GADS).
# Se a CPU não tiver AVX (comum em algumas VMs), o script usa MONGO_IMAGE_NO_AVX.
MONGO_IMAGE="mongo:6.0"
MONGO_IMAGE_NO_AVX="mongo:4.4"

# Release do GADS a instalar:
#   latest -> release publicada mais recente (inclui pre-releases)
#   stable -> release marcada como "Latest" no GitHub (exclui pre-releases)
#   <tag>  -> uma tag específica, ex.: "opus-test"
GADS_VERSION="latest"
GADS_REPO="gifflet/GADS"

# Diretório do binário (WorkingDirectory do serviço).
GADS_DIR="/root/GADS"

# Diretório onde o hub descompacta os arquivos estáticos da UI.
# Vazio = diretório temporário do sistema (padrão do GADS).
HUB_FILES_DIR="/root/GADS/hub-files"

# Prefixo dos Client IDs de credenciais Appium (vazio = padrão "gads").
# Ver docs/appium-credentials.md no repositório do GADS.
GADS_CLIENT_ID_PREFIX=""

# Flags adicionais repassadas ao `GADS hub` (dependem da release), ex.:
#   HUB_EXTRA_ARGS="--turn-username-suffix=gads"
# Consulte `./GADS hub --help` na release instalada.
HUB_EXTRA_ARGS=""

# Libera a porta do hub (e do MongoDB local) no UFW, se o UFW estiver ativo.
OPEN_FIREWALL="true"

# Token opcional do GitHub para evitar limite de requisições anônimas da API.
GITHUB_TOKEN=""
